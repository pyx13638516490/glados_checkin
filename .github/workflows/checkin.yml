name: GLaDOS 2026 Checkin

on:
  schedule:
    # 北京时间 09:17 与 15:47。一天两次是有意为之：
    # GitHub 的 schedule 经常延迟（实测约 6 小时），偶尔直接丢弃，
    # 两次能显著降低"当天没签到"的概率。签到是幂等的，重复运行无害。
    - cron: '17 1 * * *'
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || inputs.dispatch_source == 'manual' || inputs.dispatch_source == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          # 必须与生成当前会话的浏览器一致，否则签到会被 device-mismatch 拒绝。
          # 优先级：仓库 Variable > 同名 Secret > 下面的内置默认值。
          # 默认值取自 2026-11-11 生成当前 cookie 的 Edge profile
          # （chrome://version 的「用户代理」）。浏览器大版本升级后需要更新这一行，
          # 或者改用 Variable 覆盖，免得改代码。
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT || 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/158.0.0.0 Safari/537.36 Edg/158.0.0.0' }}
          CHECKIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_only && 'true' || 'false' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'plan500' }}
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
