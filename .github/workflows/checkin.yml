name: GLaDOS Checkin

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC。下面对应北京时间 09:17 与 15:47。
    # 避开整点：高峰时段计划任务可能被延迟甚至丢弃。
    - cron: '17 1 * * *'
    - cron: '47 7 * * *'

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        id: first_checkin
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: |
          python checkin.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # 退出码 2 = 网络或服务端临时故障，重试有意义。
      # 退出码 1 = token / cookie / 响应结构问题，重试必然同样失败。
      - name: Wait 60s before retry
        if: steps.first_checkin.outcome == 'failure' && steps.first_checkin.outputs.exit_code == '2'
        run: sleep 60

      - name: Retry checkin script
        id: retry_checkin
        if: steps.first_checkin.outcome == 'failure' && steps.first_checkin.outputs.exit_code == '2'
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: python checkin.py

      - name: Report failure
        if: steps.first_checkin.outcome == 'failure'
        run: |
          if [ "${{ steps.first_checkin.outputs.exit_code }}" = "1" ]; then
            echo "签到失败，且属于不可重试错误（token / cookie / 响应结构）。"
            echo "请展开上方 Run checkin script 步骤，按 ERROR 提示修复。"
          else
            echo "签到在重试后仍然失败（临时故障或服务端不可用）。"
          fi
          exit 1
