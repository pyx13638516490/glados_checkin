name: GLaDOS 2026 Checkin

on:
  # 2026-11-14 起 GLaDOS 要求 Cloudflare Turnstile，纯 HTTP 脚本无法通过，
  # 自动签到已停用，改由本机 Windows 计划任务打开浏览器 + 脚本猫完成。
  # 需要临时跑一次时用 workflow_dispatch 手动触发。
  # schedule:
  #   - cron: '17 1 * * *'
  #   - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || inputs.dispatch_source == 'manual' || inputs.dispatch_source == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          # Must match the browser that created the current gld:sess.
          # Prefer the repository Variable; accept a same-named Secret for compatibility.
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
          CHECKIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_only && 'true' || 'false' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 每天推一条：正文带「本次签到入账」和「最近一笔历史流水」，
          # 两者分开。Turnstile 拦截时能立刻看到"本次未签到成功 0 分"，
          # 不会把昨天的加分误读成今天的。
          # 只想收失败消息的话，配仓库 Variable PUSH_LEVEL=fail_only。
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'all' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'plan500' }}
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
