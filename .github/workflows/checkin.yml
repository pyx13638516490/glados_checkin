name: GLaDOS Checkin

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC。下面对应北京时间 09:17 与 15:47。
    # 避开整点：高峰时段计划任务可能被延迟甚至丢弃。
    - cron: '17 1 * * *'
    - cron: '47 7 * * *'

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 记录退出码供后续步骤判断。checkin.py 的约定：
      #   0 = 签到成功（含“今天已签到”）
      #   1 = 不可重试（token / cookie / 响应结构变更）
      #   2 = 可重试（429 / 5xx / 连接异常）
      - name: Run checkin script
        id: first_checkin
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: |
          python checkin.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # 只有可重试错误才值得等待重试：cookie/token 失效属于确定性失败，
      # 等 5 分钟再跑一遍必然同样失败，白白消耗 Actions 配额。
      # 注意这里用 outcome 而不是 conclusion —— continue-on-error 会把
      # conclusion 改成 success，只有 outcome 保留真实结果。
      - name: Wait 60s before retry
        if: steps.first_checkin.outcome == 'failure' && steps.first_checkin.outputs.exit_code == '2'
        run: sleep 60

      - name: Retry checkin script
        id: retry_checkin
        if: steps.first_checkin.outcome == 'failure' && steps.first_checkin.outputs.exit_code == '2'
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: python checkin.py

      # 微信推送失败提醒。必须排在 Report failure 之前 —— 后者会 exit 1，
      # 而 GitHub 在 step 失败后默认跳过后续步骤，放后面就永远不会执行。
      # 未配置 PUSHPLUS_TOKEN 时静默跳过，不引入新的失败点。
      - name: Push WeChat notification on failure
        if: steps.first_checkin.outcome == 'failure'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "未配置 PUSHPLUS_TOKEN，跳过微信推送"
            exit 0
          fi

          code="${{ steps.first_checkin.outputs.exit_code }}"
          if [ "$code" = "1" ]; then
            reason="不可重试错误（token / cookie / 响应结构），重试同一配置不会成功"
          elif [ "$code" = "2" ]; then
            reason="网络或服务端临时故障，已等待 60 秒重试仍失败"
          else
            reason="未知错误"
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          content="<b>退出码：</b>${code}<br><b>原因：</b>${reason}<br><br><a href='${run_url}'>点击查看运行日志</a><br><br>若提示 Cookie 已失效或没有权限，请重新登录 glados.cloud 并更新仓库 Secret GLADOS_COOKIE。"

          response=$(curl -sS -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"GLaDOS 签到失败\",\"content\":\"${content}\",\"template\":\"html\"}" \
            2>&1) || true
          echo "PushPlus 响应: $response"

      # 条件只看首次结果。不可重试错误（exit 1）时重试步骤是 skipped，
      # 若把 retry_checkin 也写进条件，这里就不会执行，而 Run checkin script
      # 带 continue-on-error，整个 job 会错误地显示成功。
      - name: Report failure
        if: steps.first_checkin.outcome == 'failure'
        run: |
          code="${{ steps.first_checkin.outputs.exit_code }}"
          if [ "$code" = "1" ]; then
            echo "::error::签到失败，且属于不可重试错误（token / cookie / 响应结构）。重试同一配置不会成功。"
          elif [ "$code" = "2" ]; then
            echo "::error::签到在 60 秒重试后仍然失败（网络或服务端临时故障）。"
          else
            echo "::error::签到失败，退出码 $code。"
          fi
          {
            echo "### 签到失败"
            echo ""
            echo "本次退出码：**$code**"
            echo ""
            echo "| 退出码 | 含义 | 处理 |"
            echo "| --- | --- | --- |"
            echo "| \`1\` | 不可重试（token / cookie / 响应结构） | 展开 \`Run checkin script\`，按 ERROR 提示修复 |"
            echo "| \`2\` | 可重试（网络 / 服务端故障） | 已自动等待 60 秒重试一次，可稍后手动重跑 |"
            echo ""
            echo "若提示 Cookie 已失效或没有权限，请重新登录 glados.cloud 并更新仓库 Secret \`GLADOS_COOKIE\`。"
            echo "此任务以失败结束，供 GitHub Actions 原生通知报告。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
