name: GLaDOS Checkin

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. These are Beijing 09:17 and 15:47.
    # Avoid minute 0 because scheduled workflows can be delayed or dropped
    # during high-load periods. The afternoon run is a cloud-side retry.
    - cron: '17 1 * * *'
    - cron: '47 7 * * *'

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        id: first_checkin
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: python checkin.py

      - name: Wait 5 minutes before retry
        if: steps.first_checkin.outcome == 'failure'
        run: sleep 300

      - name: Retry checkin script
        id: retry_checkin
        if: steps.first_checkin.outcome == 'failure'
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: python checkin.py

      - name: Send failure email
        if: steps.first_checkin.outcome == 'failure' && steps.retry_checkin.outcome == 'failure'
        continue-on-error: true
        env:
          SMTP_USERNAME: overteachersleep@gmail.com
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: 13638516490@163.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          username = os.environ["SMTP_USERNAME"]
          password = os.environ.get("SMTP_PASSWORD", "").strip()
          recipient = os.environ["MAIL_TO"]

          if not password:
              print("GMAIL_APP_PASSWORD is not configured; skip email notification.")
              raise SystemExit(0)

          subject = f"[GitHub Actions] {os.environ['WORKFLOW_NAME']} failed"
          body = f"""GLaDOS checkin failed after the first attempt and the 5-minute retry.

          Repository: {os.environ['REPOSITORY']}
          Workflow: {os.environ['WORKFLOW_NAME']}
          Branch: {os.environ['BRANCH_NAME']}
          Run ID: {os.environ['RUN_ID']}
          Run URL: {os.environ['RUN_URL']}

          Please open the GitHub Actions run URL above and check the logs.
          If the log mentions authentication, refresh the GLADOS_COOKIE secret.
          """

          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = username
          msg["To"] = recipient
          msg.set_content(body)

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context) as server:
              server.login(username, password)
              server.send_message(msg)

          print(f"Failure notification email sent to {recipient}.")
          PY

      - name: Confirm checkin result
        if: steps.first_checkin.outcome == 'failure' && steps.retry_checkin.outcome == 'failure'
        run: |
          echo "Both the first checkin attempt and the 5-minute retry failed."
          exit 1
