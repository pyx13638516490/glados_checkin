name: GLaDOS Checkin

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC。下面对应北京时间 09:17 与 15:47。
    # 避开整点：高峰时段计划任务可能被延迟甚至丢弃。
    - cron: '17 1 * * *'
    - cron: '47 7 * * *'

permissions:
  contents: write

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        id: first_checkin
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: |
          python checkin.py 2>&1 | tee /tmp/checkin_output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # 退出码 2 = 网络或服务端临时故障，重试有意义。
      # 退出码 1 = token / cookie / 响应结构问题，重试必然同样失败，
      # 所以不再像旧版那样无条件 sleep 5 分钟再跑一遍。
      - name: Wait 60s before retry
        if: steps.first_checkin.outcome == 'failure' && steps.first_checkin.outputs.exit_code == '2'
        run: sleep 60

      - name: Retry checkin script
        id: retry_checkin
        if: steps.first_checkin.outcome == 'failure' && steps.first_checkin.outputs.exit_code == '2'
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: python checkin.py

      # 临时诊断通道：GitHub 现在要求登录才能查看 Actions 日志，
      # 失败时把脚本原始输出提交回仓库，这样排查不需要交换任何凭证。
      # 邮箱已脱敏；脚本本身从不打印 Cookie。
      # 问题定位后应删掉这一步和 .diagnostics/ 目录。
      - name: Publish failure diagnostics
        if: steps.first_checkin.outcome == 'failure'
        run: |
          mkdir -p .diagnostics
          {
            echo "run_number=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "exit_code=${{ steps.first_checkin.outputs.exit_code }}"
            echo "time_utc=$(date -u +%FT%TZ)"
            echo "--- script output ---"
            sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email-redacted>/g' \
              /tmp/checkin_output.txt
          } > .diagnostics/last-failure.txt
          cat .diagnostics/last-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .diagnostics/last-failure.txt
          git diff --cached --quiet || git commit -m "chore: record checkin failure diagnostics"
          git push || echo "诊断推送失败（不影响失败结论）"

      - name: Report failure
        if: steps.first_checkin.outcome == 'failure'
        run: |
          if [ "${{ steps.first_checkin.outputs.exit_code }}" = "1" ]; then
            echo "签到失败，且属于不可重试错误（token / cookie / 响应结构）。"
            echo "请查看上方日志里的 ERROR 说明，按提示修复；重试同一个配置不会成功。"
          else
            echo "签到在重试后仍然失败（临时故障或服务端不可用）。"
          fi
          exit 1
