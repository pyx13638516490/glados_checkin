name: GLaDOS Checkin

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC。下面对应北京时间 09:17 与 15:47。
    # 避开整点：高峰时段计划任务可能被延迟甚至丢弃。
    - cron: '17 1 * * *'
    - cron: '47 7 * * *'

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        id: first_checkin
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: python checkin.py

      # Use the original outcome: continue-on-error changes conclusion to success.
      - name: Wait 5 minutes before retry
        if: steps.first_checkin.outcome == 'failure'
        run: sleep 300

      - name: Retry checkin script
        id: retry_checkin
        if: steps.first_checkin.outcome == 'failure'
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
        run: python checkin.py

      - name: Report failure
        if: steps.first_checkin.outcome == 'failure' && steps.retry_checkin.outcome == 'failure'
        run: |
          echo "::error::签到和 5 分钟后的重试均失败。请查看两次签到步骤中的 ERROR。"
          {
            echo "### 签到失败"
            echo "首次签到和等待 5 分钟后的重试均失败。"
            echo "请查看 Run checkin script 和 Retry checkin script 的 ERROR 日志。"
            echo "若提示 Cookie 已失效或没有权限，请重新登录 glados.cloud 并更新仓库 Secret GLADOS_COOKIE。"
            echo "此任务以失败结束，供 GitHub Actions 原生通知报告。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
